name: Ultron — labo

on:
  schedule:
    - cron: "23 5 * * *"   # une fois par jour, vers 7h20 heure de Paris
  workflow_dispatch: {}    # bouton "Run workflow" pour le lancer à la main

permissions:
  contents: write

concurrency:
  group: ultron            # même file d'attente qu'Ultron live : jamais deux envois en même temps
  cancel-in-progress: false

jobs:
  labo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Expériences du labo
        run: python labo.py
      - name: Enregistrer les résultats
        run: |
          git config user.name "Ultron"
          git config user.email "ultron@users.noreply.github.com"
          git add docs/labo
          if git diff --cached --quiet; then
            echo "Rien de nouveau."
          else
            git commit -m "Labo : expériences du $(date -u +%Y-%m-%d)"
            git pull --rebase
            git push
          fi
