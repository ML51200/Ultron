name: Ultron — passage horaire

on:
  schedule:
    - cron: "7 * * * *"   # toutes les heures, à la 7e minute (la bougie précédente est bien clôturée)
  workflow_dispatch: {}   # bouton "Run workflow" pour lancer un passage à la main

permissions:
  contents: write

concurrency:
  group: ultron
  cancel-in-progress: false

jobs:
  passage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Passage d'Ultron
        run: python engine.py
      - name: Enregistrer l'état
        run: |
          git config user.name "Ultron"
          git config user.email "ultron@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "Rien de nouveau."
          else
            git commit -m "Ultron : passage $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase
            git push
          fi
